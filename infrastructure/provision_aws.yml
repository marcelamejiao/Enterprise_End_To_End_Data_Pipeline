---
# Idempotent provisioning of the S3 bucket + IAM role used by Snowpipe
# (see aws/s3_setup.md). Everything in AWS is created here - nothing is set
# up by hand in the console except the one-time IAM permission grants on the
# operator's own AWS user. Three passes, each needing a value only the
# previous pass (or Snowflake) produces:
#
#   1) ansible-playbook infrastructure/provision_aws.yml -e bucket_name=<your-bucket>-retail-orders
#      Creates the bucket/prefixes, DynamoDB table, Lambda, and the
#      snowflake-retail-role IAM role with a deny-all placeholder trust
#      policy (its real ARN has to exist before Snowflake's CREATE STORAGE
#      INTEGRATION can reference it).
#   2) Create the storage integration in Snowflake, run DESC INTEGRATION,
#      then re-run with -e snowflake_iam_user_arn=... -e
#      snowflake_external_id=... to tighten that role's trust policy.
#   3) Create ORDERS_PIPE (and CUSTOMERS_PIPE, if used) in Snowflake, run
#      SHOW PIPES on each to read notification_channel (the SQS queue ARN
#      Snowflake auto-provisioned per pipe), then re-run with -e
#      snowflake_orders_sqs_queue_arn=... and/or -e
#      snowflake_customers_sqs_queue_arn=... to wire the bucket's
#      incoming/orders/ and incoming/customers/ notifications to them.
#
# Requires community.aws collection and AWS credentials in the environment
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION), never
# committed to this repo.

- name: Provision retail orders ingestion infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bucket_name: "{{ bucket_name }}"
    # S3 bucket notifications require the Lambda to live in the bucket's own
    # region, so both the bucket and the Lambda deploy task below use this
    # same var rather than each guessing their own region independently.
    aws_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('us-east-1', true) }}"

  tasks:
    - name: Create S3 bucket for incoming order/customer files
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        state: present
        region: "{{ aws_region }}"
        public_access:
          block_public_acls: true
          block_public_policy: true
          ignore_public_acls: true
          restrict_public_buckets: true

    - name: Create incoming/ingest, incoming/orders, and incoming/customers prefixes
      amazon.aws.s3_object:
        bucket: "{{ bucket_name }}"
        mode: put
        src: /dev/null
        object: "incoming/{{ item }}/"
      loop:
        - ingest
        - orders
        - customers

    # Always created, even on the first run before snowflake_iam_user_arn is
    # known: Snowflake's CREATE STORAGE INTEGRATION needs a real role ARN to
    # point at, but only tells you the IAM user ARN/external ID to trust
    # *after* that integration exists (via DESC INTEGRATION). So pass 1
    # creates this role with a deny-all placeholder trust policy just so the
    # ARN exists; re-run this playbook with -e snowflake_iam_user_arn=...
    # -e snowflake_external_id=... (from DESC INTEGRATION) to tighten it to
    # the real trust relationship.
    - name: Create/update IAM role for Snowflake's storage integration
      amazon.aws.iam_role:
        name: snowflake-retail-role
        assume_role_policy_document: "{{ lookup('template', 'templates/snowflake_trust_policy.json.j2') }}"
        create_instance_profile: false
        state: present

    - name: Attach read-only policy scoped to the bucket prefix
      amazon.aws.iam_policy:
        iam_type: role
        iam_name: snowflake-retail-role
        policy_name: snowflake-s3-read
        policy_json: "{{ lookup('template', 'templates/snowflake_s3_policy.json.j2') }}"
        state: present

    - name: Create DynamoDB table for file delivery tracking
      community.aws.dynamodb_table:
        name: FileIngestionTracker
        hash_key_name: object_key
        hash_key_type: STRING
        range_key_name: etag
        range_key_type: STRING
        billing_mode: PAY_PER_REQUEST
        state: present

    - name: Create Lambda execution role
      amazon.aws.iam_role:
        name: retail-file-tracker-lambda-role
        assume_role_policy_document: "{{ lookup('template', 'templates/lambda_trust_policy.json.j2') }}"
        managed_policies:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        create_instance_profile: false
        state: present
      register: lambda_role

    - name: Attach DynamoDB + S3 access policy to the Lambda role
      amazon.aws.iam_policy:
        iam_type: role
        iam_name: retail-file-tracker-lambda-role
        policy_name: file-tracker-access
        policy_json: "{{ lookup('template', 'templates/lambda_access_policy.json.j2') }}"
        state: present

    - name: Package the Lambda function
      community.general.archive:
        path: "{{ playbook_dir }}/../aws/lambda/file_tracker.py"
        dest: "{{ playbook_dir }}/../aws/lambda/file_tracker.zip"
        format: zip

    - name: Deploy the file-tracker Lambda function
      amazon.aws.lambda:
        name: retail-file-tracker
        state: present
        region: "{{ aws_region }}"
        zip_file: "{{ playbook_dir }}/../aws/lambda/file_tracker.zip"
        runtime: python3.12
        handler: file_tracker.handler
        role: "{{ lambda_role.iam_role.arn }}"
        timeout: 30
        environment_variables:
          TRACKER_TABLE_NAME: FileIngestionTracker
          QUARANTINE_PREFIX: "quarantine/"
          ORDERS_PREFIX: "incoming/orders/"
          CUSTOMERS_PREFIX: "incoming/customers/"
      register: file_tracker_lambda

    - name: Allow S3 to invoke the Lambda function
      amazon.aws.lambda_policy:
        function_name: retail-file-tracker
        region: "{{ aws_region }}"
        state: present
        statement_id: s3-invoke
        action: lambda:InvokeFunction
        principal: s3.amazonaws.com
        source_arn: "arn:aws:s3:::{{ bucket_name }}"

    # Scoped to incoming/ingest/ only - not the whole incoming/ prefix - for
    # two reasons: (1) it must not overlap with Snowpipe's own notification
    # on incoming/orders/ (set up separately, see aws/s3_setup.md), since S3
    # rejects overlapping prefix/event rules even across different
    # destination types; (2) it must not fire again when this same Lambda
    # moves a validated file into incoming/orders/ or incoming/customers/,
    # which would otherwise re-trigger itself on its own writes.
    - name: Wire the S3 bucket's event notification to the Lambda
      community.aws.s3_bucket_notification:
        bucket_name: "{{ bucket_name }}"
        region: "{{ aws_region }}"
        event_name: incoming-file-tracker
        lambda_function_arn: "{{ file_tracker_lambda.configuration.function_arn }}"
        events:
          - s3:ObjectCreated:*
        prefix: "incoming/ingest/"
        state: present

    # Only runnable once Snowflake's ORDERS_PIPE exists and -e
    # snowflake_orders_sqs_queue_arn=... (from SHOW PIPES' notification_channel
    # column) is passed - skipped entirely otherwise, same two-pass pattern
    # as the Snowflake trust policy above. Scoped to incoming/orders/, which
    # is disjoint from the Lambda's incoming/ingest/ notification above, so
    # the two never hit S3's overlapping-rules restriction.
    - name: Wire the S3 bucket's event notification to Snowpipe's orders SQS queue
      community.aws.s3_bucket_notification:
        bucket_name: "{{ bucket_name }}"
        region: "{{ aws_region }}"
        event_name: snowpipe-orders-notification
        queue_arn: "{{ snowflake_orders_sqs_queue_arn }}"
        events:
          - s3:ObjectCreated:*
        prefix: "incoming/orders/"
        state: present
      when: snowflake_orders_sqs_queue_arn | default('') != ''

    # Same pattern as the orders queue above, for CUSTOMERS_PIPE. Scoped to
    # incoming/customers/, disjoint from both the Lambda's incoming/ingest/
    # and the orders queue's incoming/orders/ notifications.
    - name: Wire the S3 bucket's event notification to Snowpipe's customers SQS queue
      community.aws.s3_bucket_notification:
        bucket_name: "{{ bucket_name }}"
        region: "{{ aws_region }}"
        event_name: snowpipe-customers-notification
        queue_arn: "{{ snowflake_customers_sqs_queue_arn }}"
        events:
          - s3:ObjectCreated:*
        prefix: "incoming/customers/"
        state: present
      when: snowflake_customers_sqs_queue_arn | default('') != ''
